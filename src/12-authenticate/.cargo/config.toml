[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

# On-target tests (defmt-test): `cargo test --target thumbv7em-none-eabihf --test ondevice`
# flashes the test binary with probe-rs and runs it on the real M4.
[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52833_xxAA"
# Shortcuts (run from this folder):
#   cargo embed-dev   debug build: firmware debug logs (#INF/#WRN lines) on the UART
#   cargo embed-rel   release build: protocol frames only — use this for daily login
# Watch the UART with: microbit-authenticator monitor
[alias]
embed-dev = "embed --target thumbv7em-none-eabihf"
embed-rel = "embed --release --target thumbv7em-none-eabihf"
