[default.general]
chip = "nrf52833_xxAA" # uncomment this line for micro:bit V2
# chip = "nrf51822_xxAA" # uncomment this line for micro:bit V1

[default.reset]
halt_afterwards = false

[default.rtt]
# Off on purpose: the firmware logs over the UART (debug builds only), next to
# the protocol frames. Watch them with `microbit-authenticator monitor` or
# `microbit-authenticator -v <command>` from host/microbit-authenticator.
enabled = false

[default.gdb]
enabled = false