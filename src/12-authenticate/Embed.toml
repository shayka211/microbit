[default.general]
chip = "nrf52833_xxAA" # uncomment this line for micro:bit V2
# chip = "nrf51822_xxAA" # uncomment this line for micro:bit V1

[default.reset]
halt_afterwards = false

[default.rtt]
# RTT is enabled so `cargo embed` decodes and prints defmt logs live
# (requires -Tdefmt.x in .cargo/config.toml so the binary carries the
# .defmt section). This is how you SEE the firmware working.
enabled = false

[default.gdb]
enabled = false